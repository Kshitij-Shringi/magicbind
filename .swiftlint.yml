# SwiftLint configuration for MagicBind.
# Run `swiftlint` from the repo root, or `swiftlint --fix` for autocorrectable
# rules. CI runs this on every push and pull request.

included:
  - Sources
  - Tests

excluded:
  - .build
  - build
  - Scripts

# Rules that are off by default but worth having. Keep this list short and
# justified — a linter people fight with is a linter people disable.
opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fallthrough
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - modifier_order
  - multiline_arguments
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - private_action
  - private_outlet
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

disabled_rules:
  # `trailing_comma` and SwiftPM manifests disagree about style; not worth it.
  - trailing_comma
  # Doc comments in this project deliberately wrap prose, which this rule
  # misreads as a violation.
  - orphaned_doc_comment

line_length:
  warning: 100
  error: 120
  ignores_urls: true
  ignores_comments: false

file_length:
  warning: 400
  error: 600

type_body_length:
  warning: 250
  error: 350

function_body_length:
  warning: 60
  error: 100

# The recognizer and the multitouch struct legitimately need long argument
# lists — MTFinger mirrors a C struct field-for-field.
function_parameter_count:
  warning: 8
  error: 15

large_tuple:
  warning: 3
  error: 4

cyclomatic_complexity:
  warning: 12
  error: 20

nesting:
  type_level: 2

identifier_name:
  min_length: 2
  excluded:
    - x
    - y
    - dx
    - dy
    - id
    - up

type_name:
  min_length: 3
  max_length: 45

reporter: "xcode"
